log_format asuntia_private '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name localhost;
    # Los callbacks OAuth contienen secretos transitorios en el query string.
    access_log /var/log/nginx/access.log asuntia_private;
    # 20 MiB por archivo + 1 MiB de sobre multipart; coincide con la API.
    client_max_body_size 21m;
    client_body_timeout 30s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
