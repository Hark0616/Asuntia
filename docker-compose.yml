services:
  db:
    image: postgres:16-alpine
    container_name: asuntia_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asuntia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asuntia_dev}
      POSTGRES_DB: ${POSTGRES_DB:-asuntia_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asuntia} -d ${POSTGRES_DB:-asuntia_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: asuntia_mailpit
    restart: always
    ports:
      - "8025:8025" # UI Web Mailpit
      - "1025:1025" # Puerto SMTP

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://asuntia:asuntia_dev@db:5432/asuntia_db
      - JWT_SECRET=dev_secret_key_asuntia_2026
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://127.0.0.1:8000/api/v1/storage/oauth-callback}
      - STORAGE_TOKEN_ENCRYPTION_KEY=${STORAGE_TOKEN_ENCRYPTION_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://127.0.0.1:5173}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asuntia_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://asuntia:asuntia_dev@db:5432/asuntia_db
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - JWT_SECRET=dev_secret_key_asuntia_2026
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://127.0.0.1:8000/api/v1/storage/oauth-callback}
      - STORAGE_TOKEN_ENCRYPTION_KEY=${STORAGE_TOKEN_ENCRYPTION_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    volumes:
      - asuntia_storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  postgres_data:
  asuntia_storage:
